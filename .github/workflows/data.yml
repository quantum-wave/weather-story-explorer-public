# Build the forecast data from the newest ECMWF open-data run and publish it to the orphan `data` branch (one commit,
# `latest/`). Weather Story Explorer SPEC section 10.
#
# Schedule: 09:30, 10:30, 11:30 UTC (the 00Z run) and 21:30, 22:30, 23:30 UTC (the 12Z run). Each slot first asks, with
# the standard library only and before any install, whether a newer run (or more steps of the published run) is
# posted; when nothing is new the job ends in about a minute. No in-job polling: a late run is picked up by the next slot.
# The previous data stays in place unless the new build validates and its z500a reaches 168 h; otherwise the job fails.
# Only z500 and z500a are required: when an optional product (the ensemble files) is late the slot waits until the run is
# 10 h old, then publishes without it (listed as `missing` in the manifest) and a later slot repairs the run when it appears.
# Added by W4-08: t2m (2 m temperature, g1, 0-168 h) is in every run's default fields. ivt (atmospheric rivers, 0-168 h, 0.83 GB of
# range requests, MET-10) is added to the field list on the SCHEDULED 00Z run only (never on 12Z, never on a manual run, which says
# what it wants in `fields`). After Validate, tools/compare_grib.py downloads one raw step (24 h) of ECMWF's 500 hPa height and
# compares it with the decoded z500 at five points; it records checks.grib_compare in the manifest, WARNS on a mismatch and never
# blocks the publish (design default 33, until a week of runs has shown its tolerance is right).
# Needs the `clim` branch (run the `clim` workflow once first). Cost: about 1 billed minute per idle slot.
name: data
on:
  schedule:
    - cron: "30 9,10,11,21,22,23 * * *"
  workflow_dispatch:
    inputs:
      run:
        description: "Run YYYYMMDDHH (blank = newest posted)"
        required: false
      fields:
        description: "Fields (comma list); ivt is added automatically on the scheduled 00Z run (to 168 h, about 0.83 GB of requests); add it here for a manual run. Only z500 and z500a are required; every other field is optional"
        required: false
        default: "z500,z500a,tp6,z500sd,z500em,pr1,pr10,t850a,ws250,msl,t2m"
      model:
        description: "Model: ifs (HRES, published to latest/) or aifs (AIFS Single, to latest-aifs/)"
        type: choice
        options: [ifs, aifs]
        default: ifs
      force:
        description: "Build even if the published run is current"
        type: boolean
        default: false
concurrency:
  group: data
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  data:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MODEL: ${{ inputs.model || 'ifs' }}
      FIELDS: ${{ inputs.fields || 'z500,z500a,tp6,z500sd,z500em,pr1,pr10,t850a,ws250,msl,t2m' }}
      INPUT_RUN: ${{ inputs.run }}
      INPUT_FORCE: ${{ inputs.force }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      # Standard library only (the runner's own python3), so an idle slot installs nothing.
      - name: Is there anything new?
        id: decide
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          dir=latest; [ "$MODEL" = aifs ] && dir=latest-aifs
          args=(--model "$MODEL" --fields "$FIELDS")
          if git fetch --quiet --depth 1 origin data 2>/dev/null && git show "FETCH_HEAD:$dir/manifest.json" > out/published.json 2>/dev/null; then
            args+=(--published out/published.json)
          else
            echo "no published $dir/manifest.json yet"
          fi
          [ -n "$INPUT_RUN" ] && args+=(--run "$INPUT_RUN")
          [ "$INPUT_FORCE" = "true" ] && args+=(--force)
          python3 -I pipeline/run.py runs "${args[@]}" | tee out/decide.txt
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          if grep -q '^build=false' out/decide.txt; then
            echo "::notice::nothing to build: $(grep '^reason=' out/decide.txt | cut -d= -f2-)"
            { echo "### data: nothing to build"; grep '^reason=' out/decide.txt | cut -d= -f2-; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-python@v5
        if: steps.decide.outputs.build == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        if: steps.decide.outputs.build == 'true'
        run: pip install --quiet -r requirements.txt

      - name: Fetch the climatology
        if: steps.decide.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p clim
          if ! git fetch --quiet --depth 1 origin clim || ! git show FETCH_HEAD:harmonics.npz > clim/harmonics.npz; then
            echo "::error::The 'clim' branch (harmonics.npz) does not exist. Run the 'clim' workflow once, then re-run this one."
            exit 1
          fi
          ls -l clim/harmonics.npz

      - name: Build
        if: steps.decide.outputs.build == 'true'
        shell: bash
        env:
          RUN: ${{ steps.decide.outputs.run }}
          SOURCE: ${{ steps.decide.outputs.source }}
          MAX_STEP: ${{ steps.decide.outputs.max_step }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # atmospheric rivers: the scheduled 00Z IFS run only (the hour is characters 9-10 of YYYYMMDDHH)
          fields="$FIELDS"
          if [ "${EVENT_NAME:-}" = schedule ] && [ "$MODEL" = ifs ] && [ "${RUN:8:2}" = 00 ]; then fields="$fields,ivt"; fi
          python -I pipeline/run.py build --run "$RUN" --source "$SOURCE" --max-step "$MAX_STEP" \
            --model "$MODEL" --fields "$fields" --clim clim/harmonics.npz --out out/data

      - name: Validate
        if: steps.decide.outputs.build == 'true'
        shell: bash
        env:
          RUN: ${{ steps.decide.outputs.run }}
          MAX_STEP: ${{ steps.decide.outputs.max_step }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          fields="$FIELDS"
          if [ "${EVENT_NAME:-}" = schedule ] && [ "$MODEL" = ifs ] && [ "${RUN:8:2}" = 00 ]; then fields="$fields,ivt"; fi
          # Always gated: a run missing z500 or z500a, z500a short of 168 h, or a required field with a gap over 12 h never
          # replaces latest/. An optional field that is absent or fails is dropped and listed as missing.
          python -I pipeline/run.py validate out/data --require-z500a-hours 168 --fields "$fields" --max-step "$MAX_STEP" | tee out/validate.json
          { echo "### data: built run $RUN ($MODEL)"; echo '```'; cat out/validate.json; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          missing=$(sed -n 's/.*"missing": \[\([^]]*\)\].*/\1/p' out/validate.json | tr -d '" ')
          if [ -n "$missing" ]; then
            echo "::warning::published without optional field(s): $missing"
            echo "Published without optional field(s): **$missing**. A later scheduled slot rebuilds this run when they are posted." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Cross-check against the raw GRIB
        if: steps.decide.outputs.build == 'true'
        continue-on-error: true
        shell: bash
        env:
          RUN: ${{ steps.decide.outputs.run }}
          SOURCE: ${{ steps.decide.outputs.source }}
        run: |
          # one step (24 h), non-blocking: warns and exits 0 on a mismatch; continue-on-error covers a crash of the tool itself
          python -I tools/compare_grib.py --download "$RUN" --step 24 --model "$MODEL" --source "$SOURCE" out/data \
            | tee out/compare.txt
          { echo "### GRIB cross-check"; echo '```'; cat out/compare.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to the data branch
        if: steps.decide.outputs.build == 'true'
        env:
          RUN: ${{ steps.decide.outputs.run }}
          DIR: ${{ steps.decide.outputs.dir }}
        run: python -I pipeline/run.py publish --branch data --src out/data --dest "$DIR" --keep-other --message "data $RUN ($MODEL)"
